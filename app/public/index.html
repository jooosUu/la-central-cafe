<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>caja · la central café</title>
<link rel="icon" href="/img/taza.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<!-- Ingreso -->
<section id="login" class="login" hidden>
  <div class="login-box">
    <div class="login-logo" data-svg="/img/logo-horizontal.svg" aria-label="la central café"></div>
    <h1>caja</h1>
    <p class="muted">¿Quién está atendiendo?</p>
    <div class="quien" id="quien" role="radiogroup" aria-label="Usuario"></div>
    <form id="pin-form" class="pin" autocomplete="off">
      <label for="pin" class="sr">PIN</label>
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="PIN" autocomplete="off" required>
      <div class="teclado" id="teclado"></div>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn btn-negro btn-xl" type="submit">entrar</button>
    </form>
  </div>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <nav class="nav" aria-label="Secciones">
    <div class="nav-logo" data-svg="/img/logo-horizontal.svg" aria-hidden="true"></div>
    <a href="#vender" data-v="vender"><span class="ic" data-svg="/img/icono-cafe.svg"></span>vender</a>
    <a href="#inventario" data-v="inventario"><span class="ic" data-svg="/img/icono-fuego.svg"></span>inventario<b class="badge" id="badge-inv" hidden></b></a>
    <a href="#reportes" data-v="reportes"><span class="ic" data-svg="/img/icono-rapido.svg"></span>reportes</a>
    <a href="#ajustes" data-v="ajustes"><span class="ic" data-svg="/img/icono-corazon.svg"></span>ajustes</a>
    <div class="nav-user"><span id="yo"></span><button class="link" id="salir">salir</button></div>
  </nav>
  <main id="vista" tabindex="-1"></main>
</div>

<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js?v=4"></script>
</body>
</html>
