<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>menú · la central café</title>
<link rel="icon" href="img/taza.svg">
<link rel="preload" href="fonts/Utendo-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Utendo-Medium.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css?v=15">
<script type="module" src="vendor/model-viewer.min.js"></script>
</head>
<body>
<a class="skip" href="#carta">Ir a la carta</a>

<header class="top">
  <div class="top-brand">
    <h1 class="logo" id="logo" aria-label="la central café"></h1>
    <span class="mesa" id="mesa" hidden></span>
  </div>
  <div class="top-actions">
    <button type="button" class="btn-lang" id="btn-lang" aria-label="Cambiar idioma"><span id="lang-label">EN</span></button>
    <a href="/caja/" class="btn-comanda-switch" aria-label="Abrir app de comanda y caja">
      <span class="sw-badge">🧾 caja / comanda</span>
    </a>
  </div>
</header>

<div class="iconos" id="iconos" aria-hidden="true"></div>

<section class="intro">
  <p class="intro-t" id="txt-intro-t">menú</p>
  <p class="hint"><span class="ring ring-sm" aria-hidden="true">3D</span><span id="txt-hint">Toca <b>3D</b> para ver el plato y ponerlo sobre tu mesa.</span></p>
</section>

<!-- Barra de búsqueda instantánea -->
<div class="menu-search-bar" id="search-bar-wrap">
  <div class="search-wrap">
    <span class="search-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </span>
    <input type="text" id="menu-search" placeholder="buscar café, choripán, bebidas…" autocomplete="off" aria-label="Buscar en la carta">
    <button type="button" id="search-clear" class="search-clear" hidden aria-label="Limpiar búsqueda">×</button>
  </div>
</div>

<nav class="tabs" id="tabs" aria-label="Secciones de la carta"></nav>
<main id="carta"></main>

<!-- Botón flotante de carrito / comanda -->
<button class="btn-cart-float" id="btn-cart-float" aria-label="Ver mi pedido" hidden>
  <span class="cart-icon">🛒</span>
  <span class="cart-count-badge" id="cart-count">0</span>
  <span class="cart-total-badge" id="cart-subtotal">$0</span>
</button>

<!-- Drawer / Modal de Carrito y Comanda Digital -->
<dialog id="cart-drawer" class="cart-dialog" aria-labelledby="cart-title">
  <div class="cart-drawer-box">
    <header class="cart-head">
      <div class="cart-head-info">
        <h2 id="cart-title">tu pedido</h2>
        <span class="cart-mesa-pill" id="cart-mesa-pill">Mesa 1</span>
      </div>
      <button type="button" class="cart-close-btn" id="cart-close" aria-label="Cerrar pedido">×</button>
    </header>

    <div class="cart-items" id="cart-items-list">
      <!-- Los productos añadidos se pintan aquí -->
    </div>

    <div class="cart-summary-section">
      <div class="cart-fields">
        <label class="cart-campo">
          <span id="lbl-mesa">mesa o lugar:</span>
          <select id="cart-mesa-select">
            <option value="Mesa 1">Mesa 1</option>
            <option value="Mesa 2">Mesa 2</option>
            <option value="Mesa 3">Mesa 3</option>
            <option value="Mesa 4">Mesa 4</option>
            <option value="Mesa 5">Mesa 5</option>
            <option value="Mesa 6">Mesa 6</option>
            <option value="Mesa 7">Mesa 7</option>
            <option value="Mesa 8">Mesa 8</option>
            <option value="Barra 1">Barra 1</option>
            <option value="Barra 2">Barra 2</option>
            <option value="Para Llevar">Para Llevar</option>
          </select>
        </label>
        <label class="cart-campo">
          <span id="lbl-nombre">tu nombre (opcional):</span>
          <input type="text" id="cart-nombre-input" placeholder="ej. Andrés" maxlength="40">
        </label>
        <label class="cart-campo">
          <span id="lbl-notas">instrucciones especiales:</span>
          <input type="text" id="cart-notas-input" placeholder="ej. salsa aparte, sin hielo..." maxlength="120">
        </label>
      </div>

      <div class="cart-total-bar">
        <span id="lbl-total">total a pagar:</span>
        <b id="cart-total-val">$0</b>
      </div>

      <div class="cart-actions-grid">
        <button type="button" class="btn-cart-action btn-cocina" id="btn-enviar-cocina">
          <span>👨‍🍳 Enviar a Cocina</span>
        </button>
        <button type="button" class="btn-cart-action btn-wsp" id="btn-enviar-wsp">
          <span>💬 Pedir por WhatsApp</span>
        </button>
      </div>

      <div class="cart-sub-actions">
        <button type="button" class="btn-cart-clear" id="btn-vaciar-cart">vaciar pedido</button>
      </div>
    </div>
  </div>
</dialog>

<footer class="foot">
  <div class="foot-logo" id="foot-logo" aria-hidden="true"></div>
  <div class="iconos iconos-inv" id="iconos-foot" aria-hidden="true"></div>
  <p id="txt-pie-precios">Precios en pesos colombianos</p>
  <p class="test" id="txt-pie-test">La Central Café · Calidad de origen</p>
</footer>

<!-- Visor 3D / AR -->
<dialog id="visor" aria-labelledby="v-nombre">
  <div class="v-stage">
    <model-viewer id="mv" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
      camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="800" rotation-per-second="18deg"
      shadow-intensity="1.2" shadow-softness="0.7" exposure="1.0" environment-image="neutral"
      camera-orbit="30deg 65deg auto" interaction-prompt="none">
      <button slot="ar-button" class="ar-btn"><span class="ring ring-inv" aria-hidden="true">3D</span><span id="txt-ver-mesa">ver en mi mesa</span></button>
      <div slot="progress-bar" class="v-progress"><span id="v-bar"></span></div>
    </model-viewer>
    <button class="v-close" id="v-close" aria-label="Cerrar"><span aria-hidden="true">×</span></button>
    <span class="v-badge">3D AR</span>
    <p class="v-noar" id="v-noar" hidden>Abre este menú en tu celular para ver el plato sobre tu mesa.</p>
  </div>
  <div class="v-info">
    <h2 id="v-nombre"></h2>
    <p id="v-desc"></p>
    <div class="v-precio" id="v-precio"></div>
    <div class="v-pedir-wrap" id="v-pedir-wrap">
      <!-- Botón dinámico de pedir desde el visor -->
    </div>
  </div>
</dialog>

<script type="module" src="app.js?v=15"></script>
</body>
</html>
