<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" preserveAspectRatio="xMidYMax slice">
  <!-- Pie del ticket de día: granos de café regados con polvo de aerosol. Solo negro. -->
  <defs>
    <filter id="spray" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".9" result="b"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="4" result="n"/>
      <feComposite in="b" in2="n" operator="arithmetic" k2="1.25" k3="0.8" k4="-0.6"/>
      <feComponentTransfer><feFuncR type="linear" slope="0"/><feFuncG type="linear" slope="0"/><feFuncB type="linear" slope="0"/><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
    </filter>
    <filter id="polvo" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="b"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="1" seed="8" result="n"/>
      <feComposite in="b" in2="n" operator="arithmetic" k2="1.5" k3="1" k4="-1.12"/>
      <feComponentTransfer><feFuncR type="linear" slope="0"/><feFuncG type="linear" slope="0"/><feFuncB type="linear" slope="0"/><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
    </filter>
    <mask id="ranura" maskContentUnits="userSpaceOnUse"><rect x="-20" y="-20" width="40" height="40" fill="#fff"/><path d="M0-10C4-3.4-4 3.4 0 10" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"/></mask>
    <g id="g"><ellipse rx="9" ry="12.5" fill="#000" mask="url(#ranura)"/></g>
  </defs>
  <g filter="url(#polvo)"><rect x="-20" y="170" width="340" height="60"/></g>
