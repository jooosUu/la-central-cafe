<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -30 280 300">
  <!-- MARCA DE AGUA (puntos sueltos) del ticket de noche: la llama de La Central (con la gota de café) pintada con aerosol.
       Solo negro y transparente: la impresora térmica la saca nítida, los puntos son el spray. -->
  <defs>
    <filter id="tiembla" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="9"/>
    </filter>
    <!-- spray: borde que se deshace en puntos -->
    <filter id="spray" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="3" result="n"/>
      <feComposite in="b" in2="n" operator="arithmetic" k2="1" k3="1" k4="-1.16"/>
      <feComponentTransfer><feFuncR type="linear" slope="0"/><feFuncG type="linear" slope="0"/><feFuncB type="linear" slope="0"/><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
    </filter>
    <!-- niebla de spray alrededor (puntos sueltos) -->
    <filter id="niebla" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="11" result="n"/>
      <feComposite in="b" in2="n" operator="arithmetic" k2="1.3" k3="1" k4="-1.22"/>
      <feComponentTransfer><feFuncR type="linear" slope="0"/><feFuncG type="linear" slope="0"/><feFuncB type="linear" slope="0"/><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
    </filter>
    <g id="llama">
      <path fill-rule="evenodd" d="M100 240C50 240 20 206 22 160C24 120 50 102 44 64C64 80 72 100 68 120C82 92 74 50 98 8C106 48 130 66 138 98C144 82 140 66 132 50C162 76 182 114 178 160C175 208 148 240 100 240ZM100 224C76 224 60 206 62 182C64 160 82 148 84 124C98 140 100 156 96 172C108 156 110 140 112 122C128 144 140 164 138 186C136 210 122 224 100 224ZM100 212C90 212 83 204 85 193C87 182 97 176 99 162C109 176 117 186 115 197C113 208 107 212 100 212Z"/>
      <path fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" d="M30 96C26 84 28 74 34 66M166 46C172 38 180 34 188 34M150 22C152 14 158 8 164 6M14 196C8 190 6 182 8 174M190 190C194 182 194 172 190 164"/>
    </g>
  </defs>
    <g filter="url(#spray)"><g filter="url(#tiembla)"><use href="#llama"/></g></g>
</svg>
