<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Central Café · Menú</title>
  <meta http-equiv="refresh" content="0; url=/menu/">
  <script>
    const target = '/menu/' + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    a { color: #f5a623; text-decoration: none; font-weight: bold; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #f5a623;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Cargando menú de La Central Café...</p>
  <p><small>Si no redirige automáticamente, <a href="/menu/">haz clic aquí</a>.</small></p>
</body>
</html>
