# Publica el menú digital (carpeta menu/) en GitHub Pages en cada push a main que lo toque.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar menú

on:
  push:
    branches: [main]
    paths: ['menu/**', '.github/workflows/menu-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r menu/. _site/
          rm -f _site/_poster.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
