<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>La Central Café — logo animado</title>
<style>
  @font-face { font-family: UtendoM; src: url(fonts/Utendo-Medium.ttf); }
  @font-face { font-family: UtendoXB; src: url(fonts/Utendo-ExtraBold.ttf); }
  @font-face { font-family: Geist; src: url(fonts/Geist-VariableFont_wght.ttf); }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; }
  svg { display: block; width: var(--w); height: var(--h); max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cupClip"><path d="__CUP__"/></clipPath>
    <clipPath id="bowlOnly"><rect x="0" y="0" width="307" height="500"/></clipPath>
    <clipPath id="handleOnly"><rect x="301" y="0" width="200" height="500"/></clipPath>
    <clipPath id="eBody"><rect x="290" y="337" width="120" height="100"/></clipPath>
    <clipPath id="eAccent"><rect x="290" y="250" width="120" height="87"/></clipPath>
    <clipPath id="sc0"><rect id="sr0" x="215" width="45"/></clipPath>
    <clipPath id="sc1"><rect id="sr1" x="248" width="45"/></clipPath>
    <clipPath id="sc2"><rect id="sr2" x="183" width="45"/></clipPath>
  </defs>
  <rect id="bg" x="-1000" y="-1000" width="3000" height="3000"/>
  <g id="all" class="ink">
    <!-- vapor -->
    <g clip-path="url(#sc0)"><path id="s0" d="__S0__"/></g>
    <g clip-path="url(#sc1)"><path id="s1" d="__S1__"/></g>
    <g clip-path="url(#sc2)"><path id="s2" d="__S2__"/></g>
    <!-- taza -->
    <g id="cup">
      <path id="cupLine" d="__CUP__" fill="none" stroke-width="2.4" stroke-linejoin="round"/>
      <g clip-path="url(#cupClip)">
        <g clip-path="url(#bowlOnly)"><path id="liquid"/></g>
        <g clip-path="url(#handleOnly)"><rect id="handleFill" x="301" y="160" width="40" height="110"/></g>
      </g>
      <path id="cupSolid" d="__CUP__" opacity="0"/>
    </g>
    <!-- texto -->
    <g id="laCentral" font-family="UtendoM" font-size="22.04"></g>
    <g id="cafe" font-family="UtendoXB" font-size="107.56">
      <text id="c_c" x="128.1" y="393.5">c</text>
      <text id="c_a" x="185.9" y="393.5">a</text>
      <text id="c_f" x="255.1" y="393.5">f</text>
      <g id="c_e"><text x="300" y="393.5" clip-path="url(#eBody)">é</text></g>
      <g id="c_acc"><text x="300" y="393.5" clip-path="url(#eAccent)">é</text></g>
    </g>
    <text id="reg" x="364.7" y="393.5" font-family="Geist" font-size="25.76">®</text>
  </g>
</svg>
<script>
const Q = new URLSearchParams(location.search);
const FMT = Q.get('fmt') || 'square';        // square | story | wide
const THEME = Q.get('theme') || 'cream';     // cream | dark | transparent
const DUR = 6;                               // segundos

const themes = {
  cream: { bg: '#F3ECE2', ink: '#14110F' },
  dark:  { bg: '#14110F', ink: '#F3ECE2' },
  transparent: { bg: 'transparent', ink: '#14110F' },
};
const th = themes[THEME];
document.documentElement.style.setProperty('--bg', th.bg);
const stage = document.getElementById('stage');
const views = {
  square: ['40 40 420 420', 1080, 1080],
  story:  ['0 -123.3 500 746.6', 1080, 1920],  // 9:16 (ancho 500 → alto 888.9, recortado a contenido)
  wide:   ['-123.3 40 746.6 420', 1920, 1080],
};
// story: viewBox alto = 500*1920/1080 = 888.9
views.story[0] = `0 ${250 - 888.9/2} 500 888.9`;
views.wide[0]  = `${250 - 746.7/2} 40 746.7 420`;
const [vb, W, H] = views[FMT];
stage.setAttribute('viewBox', vb);
document.documentElement.style.setProperty('--w', W + 'px');
document.documentElement.style.setProperty('--h', H + 'px');
document.getElementById('bg').setAttribute('fill', th.bg === 'transparent' ? 'none' : th.bg);
document.getElementById('all').setAttribute('fill', th.ink);
document.getElementById('cupLine').setAttribute('stroke', th.ink);

// "la central" letra por letra (posiciones exactas del archivo .ai)
const LC = [['l',139.6],['a',146.5],['c',169.0],['e',182.6],['n',197.8],['t',212.1],['r',222.2],['a',231.3],['l',247.0]];
const lcG = document.getElementById('laCentral');
const lcEls = LC.map(([ch, x]) => {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', x); t.setAttribute('y', 331.3); t.textContent = ch;
  lcG.appendChild(t); return t;
});

// ---------- easing ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInOutCubic = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const easeOutBack = (p, s = 1.9) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
// resorte amortiguado: 0 → 1 con rebote
const spring = (p, k = 4.2, z = 5.5) => p <= 0 ? 0 : 1 - Math.exp(-z * p) * Math.cos(k * Math.PI * p);
const lerp = (a, b, p) => a + (b - a) * p;

const cupLine = document.getElementById('cupLine');
const LEN = cupLine.getTotalLength();
cupLine.style.strokeDasharray = LEN;
const liquid = document.getElementById('liquid');
const handleFill = document.getElementById('handleFill');
const cup = document.getElementById('cup');

const steam = [0, 1, 2].map(i => ({
  path: document.getElementById('s' + i), rect: document.getElementById('sr' + i),
  box: document.getElementById('s' + i).getBBox(),
}));
const stOrder = [2, 0, 1];   // izquierda, centro, derecha

function setT(el, s) { el.setAttribute('transform', s); }

function render(t) {
  // 1) Contorno de la taza se dibuja (0 – 0.9s)
  const pl = easeInOutCubic(prog(t, 0.0, 0.9));
  cupLine.style.strokeDashoffset = LEN * (1 - pl);
  cupLine.style.opacity = 1 - prog(t, 1.5, 1.8);

  // 2) Café se sirve: nivel con ola (0.6 – 1.8s)
  const pf = easeInOutCubic(prog(t, 0.6, 1.75));
  const level = lerp(268, 158, pf);
  const amp = 5.5 * Math.sin(Math.PI * clamp(pf * 1.05)) + 0.0;
  let d = `M160 ${level}`;
  for (let x = 160; x <= 312; x += 4) {
    const y = level + amp * Math.sin((x / 18) + t * 9) * (0.6 + 0.4 * Math.sin(x / 31 - t * 4));
    d += `L${x} ${y.toFixed(2)}`;
  }
  d += 'L312 280L160 280Z';
  liquid.setAttribute('d', d);
  handleFill.style.opacity = easeOutCubic(prog(t, 1.25, 1.65));
  document.getElementById('cupSolid').setAttribute('opacity', prog(t, 1.68, 1.78));

  // 2b) Rebote de la taza al llenarse
  const pb = prog(t, 1.7, 2.3);
  const bump = pb > 0 && pb < 1 ? Math.sin(pb * Math.PI) * 0.045 * (1 - pb) : 0;
  setT(cup, `translate(250 265) scale(${1 + bump} ${1 - bump * 0.8}) translate(-250 -265)`);

  // 3) Vapor sube (1.6 – 2.6s, escalonado) y ondula sin parar
  stOrder.forEach((i, k) => {
    const s = steam[i], b = s.box;
    const p = easeOutCubic(prog(t, 1.6 + k * 0.13, 2.45 + k * 0.13));
    const bottom = b.y + b.height + 2;
    const top = lerp(bottom, b.y - 4, p);
    s.rect.setAttribute('y', top); s.rect.setAttribute('height', bottom - top + 0.01);
    const cx = b.x + b.width / 2;
    const live = clamp(p * 1.2);
    const sk = Math.sin(t * 2.6 + k * 1.3) * 7 * live;
    const sy = 1 + Math.sin(t * 2.1 + k) * 0.035 * live;
    const rise = (1 - p) * 10;
    setT(s.path, `translate(${cx} ${bottom}) translate(0 ${rise}) skewX(${sk}) scale(1 ${sy}) translate(${-cx} ${-bottom})`);
  });

  // 4) "café" — letras saltan con resorte (2.0 – 3.0s)
  ['c_c', 'c_a', 'c_f', 'c_e'].forEach((id, k) => {
    const el = document.getElementById(id);
    const p = prog(t, 2.0 + k * 0.09, 2.9 + k * 0.09);
    const s = spring(p, 4.2, 7.5);
    const x = [155, 215, 275, 330][k], base = 393.5;
    el.style.opacity = clamp(p * 6);
    setT(el, `translate(${x} ${base}) translate(0 ${(1 - s) * 40}) scale(${0.4 + 0.6 * s}) translate(${-x} ${-base})`);
  });
  // tilde cae como gota (2.55 – 3.3s)
  {
    const el = document.getElementById('c_acc');
    const p = prog(t, 2.5, 3.3);
    const fall = p < .45 ? -48 * (1 - Math.pow(p / .45, 2)) : 0;
    const sq = p >= .45 ? Math.exp(-7 * (p - .45)) * Math.sin((p - .45) * 22) * 0.25 : 0;
    el.style.opacity = clamp(p * 5);
    setT(el, `translate(330 336) translate(0 ${fall}) scale(${1 + sq} ${1 - sq}) translate(-330 -336)`);
  }

  // 5) "la central" aparece letra por letra (2.7 – 3.5s)
  lcEls.forEach((el, k) => {
    const p = easeOutBack(prog(t, 2.7 + k * 0.05, 3.15 + k * 0.05), 1.4);
    el.style.opacity = clamp(prog(t, 2.7 + k * 0.05, 2.9 + k * 0.05));
    setT(el, `translate(0 ${(1 - p) * 12})`);
  });

  // 6) ® gira y aparece (3.35 – 3.9s)
  {
    const el = document.getElementById('reg');
    const p = prog(t, 3.35, 3.95);
    const s = spring(p, 2.5, 6);
    el.style.opacity = clamp(p * 4);
    setT(el, `translate(374 384) rotate(${(1 - s) * -180}) scale(${s}) translate(-374 -384)`);
  }
}
window.render = render;
window.DUR = DUR;

document.fonts.ready.then(() => {
  window.__ready = true;
  if (Q.has('frame')) return;              // modo render: controlado desde fuera
  const t0 = performance.now();
  const loop = now => {
    const t = ((now - t0) / 1000) % (DUR + 1.5);
    render(Math.min(t, DUR + 10));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
});
render(0);
</script>
</body>
</html>
